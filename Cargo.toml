[package]
name = "aevum-telemetry"
version = "0.1.0"
edition = "2024"
description = "A telemetry and observability platform backed by ClickHouse"
license = "MIT"

[dependencies]
axum = "0.8.9"
clickhouse = { version = "0.15.2", features = ["time", "inserter"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tower = "0.5.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum-test = "21.1.0"
clickhouse = { version = "0.15.2", features = ["test-util"] }

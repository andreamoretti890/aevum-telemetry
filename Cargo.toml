[package]
name = "aevum-telemetry"
version = "0.1.0"
edition = "2024"
description = "An experimental telemetry and observability platform for learning Rust"
license = "MIT"

[dependencies]
axum = "0.8.9"
clickhouse = "0.15.2"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tower = "0.5.3"

[dev-dependencies]
axum-test = "21.1.0"
clickhouse = { version = "0.15.2", features = ["test-util"] }
